  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/Perfil-Gobierno-del-Paraguay-c-150x150.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Plataforma oficial del Viceministerio de Transporte (VMT - MOPC) para el análisis de la movilidad urbana en Paraguay. Visualiza datos de validaciones de pasajes, demanda, oferta y patrones de viaje por distrito y barrio."
    />
    <meta
      name="keywords"
      content="movilidad, transporte, validaciones, pasajes, demanda, oferta, buses, pasajeros, Paraguay, VMT, MOPC, análisis, georreferenciado, distritos, barrios, transporte público, planificación, datos de transporte"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Perfil-Gobierno-del-Paraguay-c-150x150.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    
    <!-- Google Analytics -->
    <!-- NOTA: El ID de Google Analytics se configura mediante la variable de entorno REACT_APP_GA_MEASUREMENT_ID -->
    <!-- La inicialización se realiza dinámicamente en index.js para mayor flexibilidad -->
    <!-- Este script inicializa el dataLayer y la función gtag, pero el script de gtag.js se carga dinámicamente desde analytics.js -->
    <script>
      // Inicializar dataLayer antes de cargar el script de GA
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      // La configuración completa y carga del script se realizará en index.js cuando se detecte el ID
    </script>
    <!-- End Google Analytics -->
    
    <title>Validaciones de Transporte | VMT - MOPC</title>
  </head>
