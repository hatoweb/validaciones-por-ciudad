server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servir la aplicación React desde /validaciones/
    # Nota: el proxy reverso externo debe mantener el prefijo /validaciones
    location /validaciones/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /validaciones/index.html;
    }

    # Manejar /validaciones sin barra final (redirigir a /validaciones/)
    location = /validaciones {
        return 301 /validaciones/;
    }

    # También servir desde la raíz (por si el proxy remueve el prefijo)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API del backend
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts aumentados para consultas largas (10 minutos)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # Buffers para respuestas grandes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Proxy para endpoint de validaciones
    location /obtener_datos {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts aumentados para consultas largas (10 minutos)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        # Buffers para respuestas grandes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
