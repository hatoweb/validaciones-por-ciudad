server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy reverso externo MANTIENE el prefijo /validaciones
    # Por lo tanto, servimos todo desde /validaciones/
    # React genera rutas con /validaciones/ en el HTML (homepage configurado)

    # Servir archivos estáticos desde /validaciones/static
    # Usamos una expresión regular para capturar todo lo que venga después de /validaciones/static
    location ~ ^/validaciones/static/(.*)$ {
        alias /usr/share/nginx/html/static/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Servir archivos de public/ desde /validaciones/ (manifest.json, favicon.ico, imágenes)
    location = /validaciones/manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        expires 1y;
        add_header Content-Type "application/manifest+json";
    }

    location = /validaciones/favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        expires 1y;
    }

    # Servir imágenes de public/ desde /validaciones/
    location ~ ^/validaciones/(logo192\.png|logo512\.png|Logo_CIDSA2\.jpg|MINISTERIO-DE-OBRAS-PUBLICAS-Curvas-01-transparente\.png|robots\.txt)$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
    }

    # También servir archivos de public/ desde la raíz (para acceso directo al contenedor)
    location = /manifest.json {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Content-Type "application/manifest+json";
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        expires 1y;
    }

    location ~ ^/(logo192\.png|logo512\.png|Logo_CIDSA2\.jpg|MINISTERIO-DE-OBRAS-PUBLICAS-Curvas-01-transparente\.png|robots\.txt)$ {
        root /usr/share/nginx/html;
        expires 1y;
    }

    # Servir la aplicación React desde /validaciones/
    location /validaciones/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /validaciones/index.html;
        index index.html;
    }

    # Redirigir /validaciones a /validaciones/
    location = /validaciones {
        return 301 /validaciones/;
    }

    # Proxy para API del backend desde /validaciones/api (el proxy externo mantiene el prefijo)
    location /validaciones/api {
        # Remover el prefijo /validaciones antes de pasar al backend
        rewrite ^/validaciones/api(.*)$ /api$1 break;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts aumentados para consultas largas (30 minutos)
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        
        # Buffers para respuestas grandes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Proxy para API del backend desde la raíz (para acceso directo al contenedor)
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts aumentados para consultas largas (30 minutos)
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        
        # Buffers para respuestas grandes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Proxy para endpoint de validaciones
    location /obtener_datos {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts aumentados para consultas largas (30 minutos)
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        
        # Buffers para respuestas grandes
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
